# llmgw4j v13 minimal deployment. TLS terminates at the front proxy — see
# docs/DEPLOYMENT.md for the nginx topology (the gateway itself stays plain
# HTTP by design, same stance as LiteLLM).
#
#   docker compose up gateway          # Java + SQLite, single replica
#   docker compose -f docker-compose.yml -f docker-compose.redis.yml up --build
# This file is a loopback-only demo. For production see docs/DEPLOYMENT.md.
services:
  gateway:
    build: .
    image: llmgw4j:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${LLMGW_ENGINE:-webflux}
      LLMGW_ADMIN_TOKEN: ${LLMGW_ADMIN_TOKEN:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LLMGW_CONTROL_DB: /app/data/llmgw-control.db
      LLMGW_ADMIN_USERNAME: ${LLMGW_ADMIN_USERNAME:-}
      LLMGW_ADMIN_PASSWORD: ${LLMGW_ADMIN_PASSWORD:-}
      LLMGW_ROOT_KEY: ${LLMGW_ROOT_KEY:-}
      # SQLite is authoritative; JSON snapshots must not replace its ledger.
      GATEWAY_GOVERNANCE_SNAPSHOT_AUTO_RESTORE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - llmgw-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s

volumes:
  llmgw-data:
