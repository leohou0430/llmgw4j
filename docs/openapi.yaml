openapi: 3.1.0
info:
  title: llmgw4j API
  version: 0.2.0
  description: |
    Java LLM API gateway (llmgw4j). Supported data-plane protocols use pass-through
    parity: each endpoint only routes to upstreams speaking the SAME protocol
    (routes carry a `protocol` field, default `*` for backwards compatibility);
    the gateway never translates between protocols and never re-serializes
    payloads.

    Resource reads and mutations require ownership; unknown or foreign ids return 404.
    Requests carrying file_id or input_file_id require a same-tenant file on the selected route.
    Capacity exhaustion or a configured mandatory governance outage returns 503.
    Buffered non-streaming responses are bounded by gateway.max-response-bytes (default 4MiB);
    exceeding this limit is reported as an upstream error. Production monetary budgets are unavailable.

    Streaming completion contract: a stream is successful ONLY when the upstream
    emitted its own protocol terminator — chat `data: [DONE]`,
    Responses `response.completed`, Messages `message_stop`. A clean EOF without
    the terminator is reported as a failure (502 before the first chunk, in-band
    `event: error` after it). The gateway never fabricates a terminator.
  license:
    name: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI Chat Completions (passthrough)
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  examples: [qwen-plus]
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                stream:
                  type: boolean
                  default: false
            examples:
              nonStream:
                value:
                  model: qwen-plus
                  messages:
                    - role: user
                      content: hi
                  stream: false
              stream:
                value:
                  model: qwen-plus
                  messages:
                    - role: user
                      content: hi
                  stream: true
      responses:
        '200':
          description: |
            Upstream answer passed through byte-for-byte. When `stream: true`,
            the body is `text/event-stream` whose terminator is `data: [DONE]`.
          content:
            application/json:
              schema:
                type: object
            text/event-stream: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/responses:
    post:
      operationId: createResponse
      summary: OpenAI Responses (passthrough)
      tags: [responses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                input:
                  description: String or structured input array (parsed for metering only, forwarded verbatim).
                stream:
                  type: boolean
                  default: false
            examples:
              nonStream:
                value:
                  model: qwen-plus
                  input: hi
                  stream: false
              stream:
                value:
                  model: qwen-plus
                  input: hi
                  stream: true
      responses:
        '200':
          description: |
            Upstream answer passed through byte-for-byte. When `stream: true`,
            delta frames are `response.output_text.delta` and the terminator is
            `response.completed` (usage inside `response.usage.output_tokens`).
            There is NO `[DONE]` line.
          content:
            application/json:
              schema:
                type: object
            text/event-stream: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/messages:
    post:
      operationId: createMessage
      summary: Anthropic Messages (passthrough)
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, max_tokens]
              properties:
                model:
                  type: string
                max_tokens:
                  type: integer
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content: {}
                system:
                  description: Parsed for token metering only, forwarded verbatim.
                stream:
                  type: boolean
                  default: false
            examples:
              nonStream:
                value:
                  model: qwen-plus
                  max_tokens: 32
                  messages:
                    - role: user
                      content: hi
              stream:
                value:
                  model: qwen-plus
                  max_tokens: 32
                  messages:
                    - role: user
                      content: hi
                  stream: true
      responses:
        '200':
          description: |
            Upstream answer passed through byte-for-byte. When `stream: true`,
            delta frames are `content_block_delta`, usage arrives in
            `message_delta`, and the terminator is `message_stop`.
            There is NO `[DONE]` line.
          content:
            application/json:
              schema:
                type: object
            text/event-stream: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/images/generations:
    post:
      operationId: createImages
      summary: Image generations (passthrough; never cached)
      tags: [images]
      description: |
        Metering: tokens are always 0; each request counts as `n` request units
        (n clamped to 1..10). Responses contain large base64 payloads and are
        never written to the semantic cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                prompt:
                  type: string
                n:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
            example:
              model: wan
              prompt: a cat
              n: 2
      responses:
        '200':
          description: Upstream answer passed through byte-for-byte (typically `data[].b64_json` entries).
          content:
            application/json:
              schema:
                type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/videos:
    post:
      operationId: createVideo
      summary: Video generation — create async task (OpenAI Sora style)
      tags: [videos]
      description: |
        Starts an async upstream job. The gateway pins the returned task id to
        the route that served the create call (sticky, TTL 24h); poll and
        content requests are routed to that same upstream with no fallback and
        no circuit breaking. Metering: 1 request unit per create, tokens 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                prompt:
                  type: string
            example:
              model: sora
              prompt: a cat runs
      responses:
        '200':
          description: "Task accepted. Poll `GET /v1/videos/{id}` until `status: completed`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
              example:
                id: video-1
                status: queued
                model: sora
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/videos/{id}:
    get:
      operationId: getVideo
      summary: Video task poll
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current task state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/videos/{id}/content:
    get:
      operationId: getVideoContent
      summary: Video content download (mp4)
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Raw video bytes, forwarded byte-for-byte.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/embeddings:
    post:
      summary: "Embeddings (W4.3): byte-faithful pass-through"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                model: { type: string }
                input: { type: [string, array] }
      responses:
        '200':
          description: "Upstream embedding response, forwarded verbatim"
          content:
            application/json:
              schema: { type: object }

  /v1/rerank:
    post:
      summary: "Rerank (W4.3): byte-faithful pass-through"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string }
                query: { type: string }
                documents: { type: array, items: { type: string } }
      responses:
        '200':
          description: "Upstream rerank response, forwarded verbatim"
          content:
            application/json:
              schema: { type: object }

  /v1/audio/speech:
    post:
      summary: "Speech synthesis (W4.3): JSON in, binary out"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string }
                input: { type: string }
                voice: { type: string }
      responses:
        '200':
          description: "Audio bytes, forwarded byte-for-byte (never a String)"
          content:
            audio/mpeg:
              schema: { type: string, format: binary }

  /v1/audio/transcriptions:
    post:
      summary: "Transcriptions (W4.3): multipart upload, byte-faithful"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                model: { type: string }
                prompt: { type: string }
                file: { type: string, format: binary }
      responses:
        '200':
          description: "Upstream transcription response; the multipart body (including its boundary) is forwarded byte-for-byte"
          content:
            application/json:
              schema: { type: object }

  /v1/files:
    post:
      summary: "File upload (W4.3): multipart, sticky-routed by file id"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                purpose: { type: string }
                file: { type: string, format: binary }
      responses:
        '200':
          description: "File object with the minted id"
          content:
            application/json:
              schema: { type: object }
    get:
      summary: "Tenant-scoped files listing is currently unsupported"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Listing is disabled to avoid exposing other tenants' upstream resources.
        '401':
          description: Missing or invalid API key.

  /v1/files/{id}:
    get:
      summary: "Retrieve a file: sticky-routed to the uploading route"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: "File object; a sticky miss resolves the wildcard route"
          content:
            application/json:
              schema: { type: object }
    delete:
      summary: "Delete a file: sticky-routed"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: "Deletion acknowledgement"
          content:
            application/json:
              schema: { type: object }

  /v1/batches:
    post:
      summary: "Batch create (W4.3): async job, mints a sticky batch id"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: "Batch object with the minted id"
          content:
            application/json:
              schema: { type: object }
    get:
      summary: "Tenant-scoped batches listing is currently unsupported"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Listing is disabled to avoid exposing other tenants' upstream resources.
        '401':
          description: Missing or invalid API key.

  /v1/batches/{id}:
    get:
      summary: "Poll a batch: sticky-routed to the creating route"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: "Batch status object"
          content:
            application/json:
              schema: { type: object }

  /v1/models:
    get:
      summary: "List models (B11): catalog pass-through"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Upstream model catalog, forwarded verbatim"
          content:
            application/json:
              schema: { type: object }

  /v1/batches/{id}/cancel:
    post:
      summary: "Cancel a batch (B11): sticky-routed to the creating route"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: "Batch object with status cancelled"
          content:
            application/json:
              schema: { type: object }

  /v1/files/{id}/content:
    get:
      summary: "Download file content (B11): sticky-routed, binary pass-through"
      tags: [data-plane]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: "File bytes, forwarded byte-for-byte"
          content:
            application/octet-stream:
              schema: { type: string, format: binary }


  /admin/snapshot:
    get:
      summary: "Usage and cache snapshot"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/snapshot/save:
    post:
      summary: "Persist token usage snapshot"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/snapshot/load:
    post:
      summary: "Restore token usage snapshot"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/routes:
    get:
      summary: "List routes with credentials redacted"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/routes/reload:
    post:
      summary: "Atomically replace routing configuration"
      tags: [admin]
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { type: object } }
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/keys:
    get:
      summary: "List API key metadata"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
    post:
      summary: "Create a runtime API key"
      tags: [admin]
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/keys/{id}:
    delete:
      summary: "Revoke a runtime identity and all rotated tokens"
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/keys/{id}/rotate:
    post:
      summary: "Rotate a runtime API key"
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/verify:
    get:
      summary: "Run configured upstream connectivity checks"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/requests:
    get:
      summary: "Read recent request logs"
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/audit/export:
    get:
      summary: "Export audit events"
      description: Accepts a full admin token or an audit read token. Only a demo with both tokens unset allows anonymous access. A read-only configuration never enables other administrative operations.
      tags: [admin]
      security: [{ adminToken: [] }, { adminReadToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/cache:
    delete:
      summary: "Invalidate response cache"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/governance:
    post:
      summary: "Update governance settings"
      tags: [admin]
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/metrics:
    get:
      summary: "Read gateway metric aggregates"
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
  /admin/console:
    get:
      summary: Static management console; data requests require administrative credentials.
      tags: [admin]
      security: []
      responses:
        '200':
          description: Console HTML.
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Required for administrative data and mutations in production.
    adminReadToken:
      type: apiKey
      in: header
      name: X-Admin-Read-Token
      description: Read token accepted by audit export.
    bearerAuth:
      type: http
      scheme: bearer
      description: Gateway API key (default demo key `sk-demo`) or an HS256 JWT when gateway.auth.jwt-secret is configured. Configured issuer/audience and provided time claims are validated.
  schemas:
    VideoTask:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, in_progress, completed, failed]
        model:
          type: string
    GatewayError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              examples: [gateway_error]
  responses:
    BadRequest:
      description: Invalid JSON body (or unknown protocol config value).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    Unauthorized:
      description: Missing or unknown API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    TooLarge:
      description: Request body exceeds `gateway.max-request-bytes` (default 4MB).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    UpstreamError:
      description: |
        Upstream failed before any content was committed: HTTP 502 with a JSON
        error body. After the first streamed chunk the failure is reported
        in-band as `event: error` followed by `[DONE]` (chat only — the
        gateway never fabricates other protocols' terminators).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
