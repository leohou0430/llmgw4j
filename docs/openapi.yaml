      parameters:
      - name: tenantId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
      - name: projectId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
  /control/secrets:
    get:
      summary: 平台管理员查询指定项目脱敏供应商凭据
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
