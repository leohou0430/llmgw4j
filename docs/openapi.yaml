  /control/quotas/pending:
    get:
      summary: List conservative in-flight or unknown token reservations for an authorized project
      parameters:
        - {name: tenantId, in: query, required: true, schema: {type: string}}
        - {name: projectId, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: At most 200 scoped pending reservations}
        '403': {description: Scope denied}
  /control/quotas/reconcile:
    post:
      summary: Tenant administrator settles independently verified unknown usage with an audit reason
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, projectId, reservationId, promptTokens, completionTokens, reason]
              properties:
                tenantId: {type: string}
                projectId: {type: string}
                reservationId: {type: string}
                promptTokens: {type: integer, minimum: 0}
                completionTokens: {type: integer, minimum: 0}
                reason: {type: string, minLength: 1}
      responses:
        '200': {description: Verified usage settled once and audited}
        '400': {description: Unknown, already settled, or invalid reservation}
        '403': {description: Tenant administration permission or CSRF denied}
  /control/billing/accounts/{tenantId}:
    get:
      summary: 账户快照（BILLING_READ 按真实scope；观察者只读）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: tenantId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 账户余额/透支/尾数（nano-CNY 整数）}
        '401': {description: 无效会话}
        '403': {description: 角色、scope或CSRF拒绝}
  /control/billing/recharge:
    post:
      summary: 幂等充值（BILLING_MANAGE 仅平台管理员，凭证号防重，写管理审计）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, amountNano, voucherNo]
              properties:
                tenantId: {type: string}
                amountNano: {type: integer}
                voucherNo: {type: string}
      responses:
        '200': {description: 入账（alreadyRecorded=true 表示凭证重放命中）}
        '401': {description: 无效会话}
        '403': {description: 非平台管理员或CSRF拒绝}
        '501': {description: billing pack 未启用}
  /control/billing/reverse:
    post:
      summary: 受控冲正（引用原充值流水整笔负入账，禁跨租户/重复冲正）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, originalEntryId, reason, operationId]
              properties:
                tenantId: {type: string}
                originalEntryId: {type: string}
                reason: {type: string, minLength: 1}
                operationId: {type: string}
      responses:
        '200': {description: 冲正入账（幂等 operationId 重放命中）}
        '400': {description: 冲正目标不存在或非本租户正充值}
        '403': {description: 非平台管理员或CSRF拒绝}
        '409': {description: 已被其他操作冲正}
  /control/billing/reservations/{tenantId}/pending:
    get:
      summary: 待核验预留清单（结果未知跨重启保留，第七项确认）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: tenantId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 预留列表}
        '403': {description: 角色、scope或CSRF拒绝}
  /control/prices/{model}:
    get:
      summary: 该模型全部冻结售价版本（改价不追溯在途）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: model, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 版本列表}
        '403': {description: 角色、scope或CSRF拒绝}
    post:
      summary: 发布新售价版本（PRICE_PUBLISH 仅平台管理员；0=该单位未定价）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: model, in: path, required: true, schema: {type: string}}
      - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputNanoPerMillion: {type: integer, minimum: 0}
                outputNanoPerMillion: {type: integer, minimum: 0}
                nanoPerImage: {type: integer, minimum: 0}
                nanoPerTask: {type: integer, minimum: 0}
                nanoPerSecond: {type: integer, minimum: 0}
      responses:
        '200': {description: 新版本号单调递增}
        '403': {description: 非平台管理员或CSRF拒绝}
  /control/recordings/{callId}:
    get:
      summary: 正文记录元数据（RECORDING_READ，观察者仅元数据）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: callId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 事件行数/终态/字节，不含正文}
        '403': {description: 角色、scope或CSRF拒绝}
        '404': {description: 记录不存在}
  /control/recordings/{callId}/body:
    get:
      summary: 正文事件（BODY_READ 三级管理员可见且写审计；观察者不可见）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: callId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 已消毒事件行}
        '403': {description: BODY_READ 拒绝}
        '404': {description: 记录不存在}
  /control/recordings/{callId}/export:
    get:
      summary: 记录导出（BODY_EXPORT 仅平台管理员，数据离开边界写审计）
      tags: [control]
      security:
      - controlSession: []
      parameters:
      - {name: callId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 完整 JSONL 内容}
        '403': {description: 非平台管理员}
        '404': {description: 记录不存在}
components:
  securitySchemes:
    controlSession:
      type: apiKey
      in: cookie
      name: llmgw_sid
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Required for administrative data and mutations in production.
    adminReadToken:
      type: apiKey
      in: header
      name: X-Admin-Read-Token
      description: Read token accepted by audit export.
    bearerAuth:
      type: http
      scheme: bearer
      description: Gateway API key (default demo key `sk-demo`) or an HS256 JWT when gateway.auth.jwt-secret is configured. Configured issuer/audience and provided time claims are validated.
  schemas:
    VideoTask:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, in_progress, completed, failed]
        model:
          type: string
    GatewayError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              examples: [gateway_error]
  responses:
    Unavailable:
      description: |
        Capacity exhausted, or a configured mandatory governance dependency is
        unavailable. Capacity rejection occurs before upstream submission and
        includes Retry-After: 1 in the unreleased working tree. Clients should
        back off; the gateway does not queue or automatically resubmit the request.
      headers:
        Retry-After:
          description: Optional backoff advice in seconds; capacity rejection uses 1.
          schema: { type: string, example: '1' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    BadRequest:
      description: Invalid JSON body (or unknown protocol config value).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    Unauthorized:
      description: Missing or unknown API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    TooLarge:
      description: Request body exceeds `gateway.max-request-bytes` (default 4MB).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    UpstreamError:
      description: |
        Upstream failed before any content was committed: HTTP 502 with a JSON
        error body. After the first streamed chunk the failure is reported
        in-band as `event: error` followed by `[DONE]` (chat only — the
        gateway never fabricates other protocols' terminators).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
tags:
  - name: admin
  - name: chat
  - name: responses
  - name: messages
  - name: images
  - name: videos
