      description: >-
        Current SQLite route authority returns 409; publish through /control/routes/publish instead.
        For independent writable sources, each route object accepts an optional upstreamProtocol: "" (default)
        keeps byte-for-byte passthrough; "chat" converts the request to the
        DeepSeek Chat upstream. Any other value is rejected with 400.
      tags: [admin]
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { type: object } }
      responses:
        '200':
          description: Operation succeeded; API key plaintext is returned only on create or rotate.
          content:
            application/json:
              schema: {}
        '409':
          description: Read-only SQLite authority; use versioned control-plane publication.
        '401':
          description: Missing or invalid administrative token.
        '400':
          description: Invalid configuration or request.
        '404':
          description: Resource or identity not found.
        '501':
          description: The configured implementation does not support this operation.
