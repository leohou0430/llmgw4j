openapi: 3.1.0
info:
  title: llmgw4j API
  version: 0.5.0
  description: |
    Java LLM API gateway (llmgw4j). Supported data-plane protocols use pass-through
    parity: each endpoint only routes to upstreams speaking the SAME protocol
    (routes carry a `protocol` field, default `*` for backwards compatibility);
    the gateway never translates between protocols and never re-serializes
    payloads.

    Resource reads and mutations require ownership; unknown or foreign ids return 404.
    Requests carrying file_id or input_file_id require a same-tenant file on the selected route.
    Capacity exhaustion or a configured mandatory governance outage returns 503.
    Unreleased working-tree behavior: capacity rejection includes Retry-After: 1
    before upstream submission. This is client backoff advice, not an automatic
    gateway retry; other 503 causes do not gain this synthetic capacity hint.
    Buffered non-streaming responses are bounded by gateway.max-response-bytes (default 4MiB);
    exceeding this limit is reported as an upstream error. Production monetary budgets are unavailable.

    Streaming completion contract: a stream is successful ONLY when the upstream
    emitted its own protocol terminator — chat `data: [DONE]`,
    Responses `response.completed`, Messages `message_stop`. A clean EOF without
    the terminator is reported as a failure (502 before the first chunk, in-band
    `event: error` after it). The gateway never fabricates a terminator.

    Chapter-9 governance contracts (2026-11-20 review round):
    Attempt budget — every attempt's timeout is capped to the remaining total
    deadline (gateway.upstream.total-deadline-ms and/or the absolute epoch-ms
    request header `X-LLMGW-Deadline`); an exhausted budget stops the plan with
    504 `attempt budget exhausted` before any further upstream try.
    Strict budget — with `gateway.billing.strict-budget=true`, a token request
    without an explicit output bound is rejected 400
    `strict_budget_requires_output_bound` (a provable reservation requires a
    bounded max output; soft mode keeps estimate-based reservations).
    Idempotency — an `Idempotency-Key` request header makes the gateway reject
    duplicate submissions with 409 `idempotent_request_exists` (the response
    reason carries the original call/request identifiers; streaming is never
    replayed, unknown outcomes are never auto-resent).
    Attribution — optional `X-LLMGW-Session-Id` / `X-LLMGW-Turn-Id` headers are
    sanitized, bound to the authenticated subject, recorded in audit/ledger and
    echoed back; missing attribution stays unattributed, never fabricated.
    Governance dependency outages (Redis) fail closed with 503 + Retry-After: 1
    per gateway.redis.failure-policy; only the explicitly chosen
    fail-open-limits mode allows token-bucket reads to proceed.
  license:
    name: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /control/status:
    get:
      summary: 真实控制面状态
      tags:
      - control
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
  /control/login:
    post:
      summary: 账号密码登录，10次/分钟超限429
      tags:
      - control
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
  /control/session:
    get:
      summary: 恢复有效会话与当前进程CSRF token，响应no-store
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
  /control/logout:
    post:
      summary: 当前会话+CSRF退出，无租户角色限制
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
  /control/tenants:
    get:
      summary: 主体可见租户列表
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
    post:
      summary: 平台管理员创建租户
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
