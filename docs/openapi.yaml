        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
    post:
      summary: 平台管理员创建项目（初始项目token额度0）
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                tenantId:
                  type: string
                name:
                  type: string
  /control/accounts:
    get:
      summary: 按主体scope列出账号（无密码hash）
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
    post:
      summary: 按角色授予矩阵创建账号
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  minLength: 12
                role:
                  type: string
                  enum:
                  - PLATFORM_ADMIN
                  - TENANT_ADMIN
                  - PROJECT_ADMIN
                  - PROJECT_VIEWER
                tenantId:
                  type: string
                projectId:
                  type: string
  /control/keys:
    get:
      summary: 指定项目Key脱敏列表
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: tenantId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
      - name: projectId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
    post:
      summary: 创建真实数据面Key，明文仅返回一次
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                projectId:
                  type: string
                keyId:
                  type: string
                name:
                  type: string
                quotaTokens:
                  type: integer
  /control/keys/{id}/rotate:
    post:
      summary: 轮换Key，旧凭据停止新请求，已受理请求继续
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                projectId:
                  type: string
  /control/keys/{id}/revoke:
    post:
      summary: 吊销Key，保留在途请求结算
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                projectId:
                  type: string
  /control/quotas:
    post:
      summary: 调整项目/Key累计token上限，不重置已用和在途占额，原因必填
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                projectId:
                  type: string
                keyId:
                  type: string
                quotaTokens:
                  type: integer
                reason:
                  type: string
  /control/catalog:
    get:
      summary: 指定项目资源目录，无内部来源凭据
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: tenantId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
      - name: projectId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
    post:
      summary: 手工登记目录，不创建供应商资源
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                projectId:
                  type: string
                gatewayId:
                  type: string
                type:
                  type: string
                upstreamId:
                  type: string
                sourceRoute:
                  type: string
                provider:
                  type: string
                configVersion:
                  type: string
  /control/usage:
    get:
      summary: 指定项目累计Key用量
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
          description: 角色、scope、CSRF拒绝
        '409':
          description: 版本冲突
        '429':
          description: 登录限速
        '503':
          description: 空间、容量或根密钥不可用
      parameters:
      - name: tenantId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
      - name: projectId
        in: query
        description: 省略使用账号scope；平台管理员须选择项目
        schema:
          type: string
  /control/audit:
    get:
      summary: 指定项目最近50条管理审计，含操作者
      tags:
      - control
      security:
      - controlSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 输入无效
        '401':
          description: 无效会话/凭据
        '403':
