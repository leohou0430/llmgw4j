  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI Chat Completions (passthrough)
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  examples: [qwen-plus]
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                stream:
                  type: boolean
                  default: false
            examples:
              nonStream:
                value:
                  model: qwen-plus
                  messages:
                    - role: user
                      content: hi
                  stream: false
              stream:
                value:
                  model: qwen-plus
                  messages:
                    - role: user
                      content: hi
                  stream: true
      responses:
        '200':
          description: |
            Upstream answer passed through byte-for-byte. When `stream: true`,
            the body is `text/event-stream` whose terminator is `data: [DONE]`.
          content:
            application/json:
              schema:
                type: object
            text/event-stream: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/responses:
    post:
      operationId: createResponse
      summary: OpenAI Responses (passthrough)
      tags: [responses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                input:
                  description: String or structured input array (parsed for metering only, forwarded verbatim).
                stream:
                  type: boolean
                  default: false
            examples:
              nonStream:
                value:
                  model: qwen-plus
                  input: hi
                  stream: false
              stream:
                value:
                  model: qwen-plus
                  input: hi
                  stream: true
      responses:
        '200':
          description: |
            Upstream answer passed through byte-for-byte. When `stream: true`,
            delta frames are `response.output_text.delta` and the terminator is
            `response.completed` (usage inside `response.usage.output_tokens`).
            There is NO `[DONE]` line.
          content:
            application/json:
              schema:
                type: object
            text/event-stream: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/messages:
    post:
      operationId: createMessage
      summary: Anthropic Messages (passthrough)
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, max_tokens]
              properties:
                model:
                  type: string
                max_tokens:
                  type: integer
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content: {}
                system:
                  description: Parsed for token metering only, forwarded verbatim.
                stream:
                  type: boolean
                  default: false
            examples:
              nonStream:
                value:
                  model: qwen-plus
                  max_tokens: 32
                  messages:
                    - role: user
                      content: hi
              stream:
                value:
                  model: qwen-plus
                  max_tokens: 32
                  messages:
                    - role: user
                      content: hi
                  stream: true
      responses:
        '200':
          description: |
            Upstream answer passed through byte-for-byte. When `stream: true`,
            delta frames are `content_block_delta`, usage arrives in
            `message_delta`, and the terminator is `message_stop`.
            There is NO `[DONE]` line.
          content:
            application/json:
              schema:
                type: object
            text/event-stream: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/images/generations:
    post:
      operationId: createImages
      summary: Image generations (passthrough; never cached)
      tags: [images]
      description: |
        Metering: tokens are always 0; each request counts as `n` request units
        (n clamped to 1..10). Responses contain large base64 payloads and are
        never written to the semantic cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                prompt:
                  type: string
                n:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
            example:
              model: wan
              prompt: a cat
              n: 2
      responses:
        '200':
          description: Upstream answer passed through byte-for-byte (typically `data[].b64_json` entries).
          content:
            application/json:
              schema:
                type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/videos:
    post:
      operationId: createVideo
      summary: Video generation — create async task (OpenAI Sora style)
      tags: [videos]
      description: |
        Starts an async upstream job. The gateway pins the returned task id to
        the route that served the create call (sticky, TTL 24h); poll and
        content requests are routed to that same upstream with no fallback and
        no circuit breaking. Metering: 1 request unit per create, tokens 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                prompt:
                  type: string
            example:
              model: sora
              prompt: a cat runs
      responses:
        '200':
          description: "Task accepted. Poll `GET /v1/videos/{id}` until `status: completed`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
              example:
                id: video-1
                status: queued
                model: sora
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/videos/{id}:
    get:
      operationId: getVideo
      summary: Video task poll
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current task state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
