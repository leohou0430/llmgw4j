  /mcp/{server}:
    post:
      summary: MCP 网关（Modern 2026-07-28；gateway.mcp.enabled=true 时可用）
      tags:
      - mcp
      security: []
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
        description: 配置声明的 MCP 服务器逻辑名（出口白名单）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0；params._meta 必须携带 io.modelcontextprotocol/protocolVersion=2026-07-28 与 clientCapabilities（可为空对象）
      responses:
        '200':
          description: JSON-RPC result（上游响应重构后返回；tools/list 已按授权谓词过滤）
        '202':
          description: 审批挂起（高风险工具 require-approval；审批未决不得执行）
        '400':
          description: 协议校验失败（_meta 缺失/版本不支持/镜像头不一致/报文超限）
        '401':
          description: 无效凭据或无归属主体
        '403':
          description: 默认拒绝（无匹配授权规则）或 Origin 不在白名单；订阅/Tasks 扩展默认关闭
        '404':
          description: 未知服务器路由或网关未启用
        '502':
          description: 上游不可达（Legacy 桥接握手失败）
