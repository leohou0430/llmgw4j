name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests + both engine contracts (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LLMGW_TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install contract tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof jq
          python3 -m pip install 'PyYAML>=6,<7'
      - name: Validate public contract and YAML
        run: python3 bin/check-openapi.py docs/openapi.yaml .github/workflows/ci.yml .github/workflows/release.yml docker-compose.yml docker-compose.redis.yml
      - name: Verify benchmark evidence parser and mock contract
        run: python3 -m unittest discover -s bench/cross-gateway -p 'test_*.py'
      - name: Check module layout
        run: bash bin/check-module-layout.sh
      - name: Verify default artifact (including JUnit)
        run: mvn -B clean verify
      - name: Verify both data planes against the same artifact
        run: |
          bash bin/smoke-stream-errors.sh
          bash bin/smoke-v13-extensions.sh
          bash bin/smoke-v13-hardening.sh
          python3 bin/smoke-tenant-isolation.py
          python3 bin/smoke-admin-auth.py
          python3 bin/smoke-jwt-auth.py
      - name: Verify optional Redis profile (including JUnit)
        run: mvn -B -Predis clean verify
