name: 功能建议
description: 新能力、SPI 扩展、治理策略或可观测性改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        本项目刻意保持**核心简单、治理层全部走 SPI**。请说明你的建议是否需要打破这两条边界：
        - `Router` / `UpstreamProvider` / `TokenLimiter` / `UsageLedger` / `CircuitBreaker` /
          `SemanticCache` / `ApiKeyRegistry` / `AuditSink` / `SnapshotStore` / `RouteConfigSource`
          均以接口 + `@ConditionalOnMissingBean` 提供默认实现，不应让核心依赖某个具体组件；
        - 流式协议保真（`data: [DONE]` 唯一完成判据、不伪造终止帧）是不可协商的契约。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 具体场景优先，不要只写「支持 XX」；附上真实调用方或失败案例
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议做法
      description: 预期落在哪个模块 / 哪个 SPI；如果只影响一个引擎，说明另一个引擎如何处理
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 新增或变更 SPI
        - 协议 / SSE 契约
        - 治理与计量语义
        - WebFlux 数据面
        - 虚拟线程数据面
        - native image / AOT 反射提示
        - 压测与回归脚本
        - 仅文档
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: 兼容性判断
      options:
        - 向后兼容，默认行为不变
        - 需要新增配置项（有默认值）
        - 会改变默认行为或既有口径
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 尤其是「能否不进核心、作为外部 SPI 实现接入」
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我理解热路径上新增的分配、格式化或同步都会要求配对 A/B 证据
          required: true
        - label: 若涉及性能收益，我会走「性能 / 压测数据」模板而不是在这里贴数字
          required: true
