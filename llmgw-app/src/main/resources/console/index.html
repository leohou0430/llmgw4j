<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>llmgw4j console</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 24px; background: #0d1117; color: #c9d1d9; }
  h1 { font-size: 18px; } h2 { font-size: 14px; color: #58a6ff; margin-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; background: #161b22; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border-bottom: 1px solid #21262d; padding: 3px 6px; text-align: left; }
  th { color: #8b949e; font-weight: normal; }
  .ok { color: #3fb950; } .err { color: #f85149; } .muted { color: #8b949e; }
  #adminToken { width: 220px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 3px 6px; }
  button { background: #21262d; color: #58a6ff; border: 1px solid #30363d; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  pre { margin: 4px 0; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>llmgw4j console <span class="muted">(read-only; every call uses your admin token)</span></h1>
<p>
  <input id="adminToken" placeholder="X-Admin-Token (empty = open)">
  <button onclick="refreshAll()">refresh</button>
  <span id="status" class="muted"></span>
</p>
<div class="grid">
  <div class="card"><h2>routes</h2><pre id="routes" class="muted">…</pre></div>
  <div class="card"><h2>api keys</h2><pre id="keys" class="muted">…</pre></div>
  <div class="card"><h2>usage &amp; spend</h2><pre id="usage" class="muted">…</pre></div>
  <div class="card"><h2>recent audit</h2><pre id="audit" class="muted">…</pre></div>
  <div class="card" style="grid-column: 1 / -1;"><h2>recent requests <span class="muted">(bounded ring)</span></h2><pre id="requests" class="muted">…</pre></div>
  <div class="card" style="grid-column: 1 / -1;"><h2>metrics (llmgw.*)</h2><pre id="metrics" class="muted">…</pre></div>
</div>
<script>
const $ = id => document.getElementById(id);
const token = () => $('adminToken').value.trim();
const headers = () => token() ? { 'X-Admin-Token': token() } : {};
async function jget(path) {
  const r = await fetch(path, { headers: headers() });
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
}
function esc(v) { const d = document.createElement('div'); d.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 1); return d.innerHTML; }
async function refreshAll() {
  $('status').textContent = 'refreshing…';
  const tasks = [
    ['routes', '/admin/routes', v => v.map(r => `${r.id} [${r.protocol || '*'}] model=${r.model} provider=${r.provider || '-'} url=${r.targetUrl} w=${r.weight}`).join('\n')],
    ['keys', '/admin/keys', v => v.map(k => `${k.id} "${k.name}" quota=${k.quotaTokens} budget=$${(k.budgetMicroUsd || 0) / 1e6} group=${k.group || '-'} models=${JSON.stringify(k.allowedModels)}`).join('\n')],
    ['usage', '/admin/snapshot', v => {
      const usage = v.usage || {}, spend = v.spendMicroUsd || {}, byGroup = v.spendMicroUsdByGroup || {};
      const lines = Object.keys(usage).map(k => `${k}: req=${usage[k].requests} tok=${usage[k].promptTokens}+${usage[k].completionTokens} err=${usage[k].errors} spend=$${((spend[k] || 0) / 1e6).toFixed(6)}`);
      lines.push('— by group —');
      Object.keys(byGroup).forEach(g => lines.push(`${g || '(ungrouped)'}: $${(byGroup[g] / 1e6).toFixed(6)}`));
      lines.push(`cacheSize=${v.cacheSize}`);
      return lines.join('\n');
    }],
    ['audit', '/admin/snapshot', v => (v.recentAudit || []).slice(0, 10).map(e => `${e.at} ${e.type} key=${e.keyId} ${esc(e.details && (e.details.requestId || ''))}`).join('\n')],
    ['requests', '/admin/requests?limit=20', v => v.map(e => `${e.at} ${e.success ? 'OK  ' : 'DENY'} ${e.protocol} ${e.model} key=${e.keyId} tok=${e.promptTokens}+${e.completionTokens} ${e.latencyMs}ms ttft=${e.ttftMs}ms${e.cached ? ' CACHED' : ''}${e.denyReason ? ' ' + e.denyReason : ''}`).join('\n') || '(empty)'],
    ['metrics', '/admin/metrics', v => JSON.stringify(v, null, 1).split('\n').slice(0, 40).join('\n')],
  ];
  for (const [id, path, fmt] of tasks) {
    try { $(id).innerHTML = esc(fmt(await jget(path))); $(id).classList.remove('muted'); }
    catch (e) { $(id).innerHTML = '<span class="err">' + esc(String(e)) + '</span>'; }
  }
  $('status').textContent = 'done ' + new Date().toLocaleTimeString();
}
refreshAll();
</script>
</body>
</html>
