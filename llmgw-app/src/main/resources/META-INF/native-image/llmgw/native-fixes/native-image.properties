# Fastjson2 2.0.56 initializes JSONFactory caches at build time but omits
# this trivial holder (no static initializer). Keep it consistent with its owner.
# Netty 4.2 CleanerJava25 uses shared FFM arenas for direct-buffer cleanup.
Args = --initialize-at-build-time=com.alibaba.fastjson2.JSONFactory$CacheItem \
    -H:+UnlockExperimentalVMOptions -H:+SharedArenaSupport -H:-UnlockExperimentalVMOptions
